<script>
const btns=[...document.querySelectorAll('.bar button')],cards=[...document.querySelectorAll('.card')],cnt=document.getElementById('count');
function apply(f){cards.forEach(c=>{c.style.display=(f==='all'||c.dataset.tags.split(' ').includes(f))?'':'none'});
cnt.textContent='表示中: '+cards.filter(c=>c.style.display!=='none').length+' 枚';}
btns.forEach(b=>b.onclick=()=>{btns.forEach(x=>x.classList.remove('on'));b.classList.add('on');apply(b.dataset.f)});
apply('all');
</script></body></html>

<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>section shot</title>
<style>body{margin:0;background:#0B2E42}#w{height:100vh;overflow:hidden}iframe{width:1280px;height:1500px;border:0;transform:scale(.62);transform-origin:0 0}</style>
</head><body><div id="w"><iframe id="f"></iframe></div>
<script>
const p=new URLSearchParams(location.search);
const f=document.getElementById('f');
f.src=p.get('u')||'/index.html';
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument;
  d.querySelectorAll('.reveal').forEach(e=>e.classList.add('visible'));
  d.documentElement.style.scrollBehavior='auto';
  const t=d.querySelector(p.get('sel')||'#services');
  if(t) f.contentWindow.scrollTo(0, t.offsetTop + (+p.get('off')||0));
},700);
</script></body></html>
